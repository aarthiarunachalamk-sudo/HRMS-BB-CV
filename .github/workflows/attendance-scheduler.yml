name: HRMS reminder scheduler

on:
  schedule:
    # Every ten minutes from 05:30 to 22:29 IST. Commands deduplicate
    # reminders and internally apply their own attendance time windows.
    - cron: '*/10 0-16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendance-scheduler
  cancel-in-progress: false

jobs:
  run-attendance-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Process reminders and automatic checkouts
        run: |
          python manage.py auto_checkout_attendance
          python manage.py send_client_visit_reminders
