name: Attendance scheduler

on:
  schedule:
    # GitHub cron uses UTC. These are 09:00, 09:10, 09:20 and 09:30 IST.
    - cron: '30,40,50 3 * * *'
    - cron: '0 4 * * *'
    # Approved second-half leave auto checkout: 13:00 IST.
    - cron: '30 7 * * *'
    # Normal auto checkout: 18:30 IST.
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attendance-scheduler
  cancel-in-progress: false

jobs:
  run-attendance-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      # Scheduled workflows are defined on the default branch, but the HRMS
      # application is currently deployed from develop2.
      - uses: actions/checkout@v4
        with:
          ref: develop2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Process reminders and automatic checkouts
        run: python manage.py auto_checkout_attendance
