name: Keep server alive

on:
  schedule:
    # Ping every 10 minutes from 02:30 UTC to 14:30 UTC
    # = 08:00 IST to 20:00 IST (business hours + buffer)
    - cron: '*/10 2-14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping HRMS server to prevent cold start
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 55 \
            "https://hrms-bitbyte-mobileapp-1.onrender.com/api/health/" \
            || echo "000")
          echo "Server responded with HTTP $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "::warning::Server did not respond — may be in cold-start"
          else
            echo "Server is alive"
          fi
