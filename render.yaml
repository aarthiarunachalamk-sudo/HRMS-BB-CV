services:
  - type: web
    name: hrms_bitbyte_mobileapp-1
    runtime: python
    plan: free
    rootDir: backend
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn backend.wsgi:application --bind "0.0.0.0:$PORT" --workers 2 --timeout 120 --access-logfile - --error-logfile -
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CLIENT_VISIT_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLIENT_VISIT_CLOUDINARY_API_KEY
        sync: false
      - key: CLIENT_VISIT_CLOUDINARY_API_SECRET
        sync: false
      - key: CLIENT_VISIT_CLOUDINARY_FOLDER
        value: hrms-client-visits
